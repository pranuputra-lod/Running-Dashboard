<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Running Dashboard</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: sticky top bar (brand, tabs, sync) over a single wide working column. Dark-first, electric cyan accent; zone colors are data only. */
:root{
  --bg:#090C11;--surface:#10151C;--surface2:#18202A;--fg:#EDF1F5;--muted:#8794A4;--line:#222C38;
  --accent:#1FD1F9;--accent-fg:#031219;--accent-soft:#0F2A35;--glow:rgba(31,209,249,.35);
  --good:#4CC38A;--warn:#E3B04B;--bad:#EF6B5C;
  --z1:#7F97AE;--z2:#3DBE86;--z3:#E6B635;--z4:#F08A42;--z5:#EE5959;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;--f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#E6EBF1;--fg:#0E151D;--muted:#566474;--line:#D2D9E1;
  --accent:#0A7EA4;--accent-fg:#FFFFFF;--accent-soft:#DDF0F7;--glow:rgba(10,126,164,.22);
  --good:#1E8E5A;--warn:#B7791F;--bad:#C0392B;
  --z1:#6F879E;--z2:#2F9E6B;--z3:#C9981A;--z4:#E0702A;--z5:#D23B3B;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#E6EBF1;--fg:#0E151D;--muted:#566474;--line:#D2D9E1;
  --accent:#0A7EA4;--accent-fg:#FFFFFF;--accent-soft:#DDF0F7;--glow:rgba(10,126,164,.22);
  --good:#1E8E5A;--warn:#B7791F;--bad:#C0392B;
  --z1:#6F879E;--z2:#2F9E6B;--z3:#C9981A;--z4:#E0702A;--z5:#D23B3B;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding-block:0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:clamp(34px,5vw,48px);font-weight:800;text-transform:uppercase;letter-spacing:.015em;font-style:italic}
h3{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:24px;padding-block:12px;flex-wrap:nowrap}
.brand{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:26px;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
.brand small{display:block;font:500 11px var(--f-body);font-style:normal;letter-spacing:.1em;color:var(--muted);margin-top:4px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1 1 0;min-width:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--muted);text-decoration:none;padding:9px 12px;font:700 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
main{display:flex;flex-direction:column;gap:22px;min-width:0;padding-top:28px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.head p{color:var(--muted);max-width:62ch;margin-top:8px}
.head h2::after{content:"";display:block;width:56px;height:4px;background:var(--accent);margin-top:10px;transform:skewX(-20deg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat{justify-content:space-between}
.stat .n{font:800 56px/1 var(--f-display);font-style:italic;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 28px var(--glow)}
.stat .n small{font-size:18px;color:var(--muted);font-weight:700;margin-left:6px;font-style:normal;letter-spacing:.04em;text-shadow:none}
.stat .l{font-size:13px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;min-width:0}
input,select,textarea{font:400 15px var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:700 15px var(--f-display);letter-spacing:.09em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);border:0;border-radius:3px;padding:10px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--line);padding:6px 11px;font-size:14px}
.btn.del:hover{border-color:var(--bad);filter:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 130px}
.row>.btn{flex:0 0 auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:6px 10px 8px 0;white-space:nowrap}
td{padding:7px 10px 7px 0;border-top:1px solid var(--line);vertical-align:middle}
td input,td select{padding:7px 9px;min-width:72px}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font:700 13px var(--f-display);letter-spacing:.08em;padding:2px 10px;border-radius:2px;background:var(--surface2);color:var(--fg)}
.chip.a{background:var(--accent);color:var(--accent-fg)}
.zrow{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.zrow:first-child{border-top:0}
.zbadge{font:800 22px var(--f-display);font-style:italic;color:#0A0F15;text-align:center;border-radius:3px;padding:3px 0}
.zbar{display:flex;height:10px;gap:3px;transform:skewX(-20deg)}
.zbar i{display:block;height:100%}
.zhr{font:700 26px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.zhr .note{font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:240px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.bars{position:relative;width:100%;flex:1;display:flex;align-items:end;gap:3px;justify-content:center}
.bars i{display:block;width:42%;border-radius:2px 2px 0 0;min-height:2px}
.bars .plan{background:transparent;border:1px dashed var(--muted)}
.bars .done{background:var(--accent);box-shadow:0 0 14px var(--glow)}
.col span{font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tl{display:flex;gap:4px;align-items:end;height:150px}
.seg{border-radius:3px 3px 0 0;background:var(--surface2);border:1px solid var(--line);padding:8px 10px;font-size:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.seg b{font:800 18px var(--f-display);font-style:italic;text-transform:uppercase;letter-spacing:.03em}
.seg.now{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 0 24px var(--glow)}
.fb{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:14px;font-size:14px;line-height:1.6}
.log{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.log:first-child{border-top:0;padding-top:0}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.empty{padding:24px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);text-align:center}
.dim{opacity:.5}
@media (max-width:820px){
  .top{gap:6px 16px;flex-wrap:wrap}
  nav{order:3;flex:1 1 100%}
  .sync{margin-left:auto}
  .stat .n{font-size:46px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.btn,nav a{transition:filter .15s,color .15s,border-color .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Running <span>Dashboard</span><small id="who">Program lari pribadi</small></div>
    <nav id="nav" aria-label="Menu utama"></nav>
    <div class="sync" id="sync">Memuat data…</div>
  </header>
  <main id="view"></main>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
const DAYS=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const TYPES=["Istirahat","Easy run","Long run","Tempo","Interval","Recovery","Cross training"];
const ZOPTS=["-","Z1","Z2","Z1-Z2","Z3","Z3-Z4","Z4","Z4-Z5","Z5"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const parseD=s=>new Date(s+"T00:00:00");
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const mondayOf=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const fmtDate=s=>s?parseD(s).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"-";
const dayIdx=s=>(parseD(s).getDay()+6)%7;

/* ---------- Data awal (contoh, bisa diubah) ---------- */
const DEF_MAIN=()=>({
  profile:{name:"",age:30,weight:65,hrmax:"",hrrest:60,method:"hrr"},
  plan:[
    {type:"Easy run",km:6,zone:"Z2",note:""},
    {type:"Interval",km:8,zone:"Z4-Z5",note:"6 x 800 m, jogging 400 m"},
    {type:"Istirahat",km:0,zone:"-",note:""},
    {type:"Tempo",km:8,zone:"Z3-Z4",note:"20 menit tempo"},
    {type:"Recovery",km:4,zone:"Z1",note:""},
    {type:"Long run",km:14,zone:"Z2",note:"Pace santai, bisa ngobrol"},
    {type:"Istirahat",km:0,zone:"-",note:""}
  ],
  blocks:{start:mondayOf(today()),items:[
    {id:uid(),name:"Base",weeks:6,vol:30,focus:"Bangun volume aerobik"},
    {id:uid(),name:"Build",weeks:6,vol:40,focus:"Tempo dan threshold"},
    {id:uid(),name:"Peak",weeks:3,vol:45,focus:"Interval dan simulasi race"},
    {id:uid(),name:"Taper",weeks:2,vol:25,focus:"Volume turun, intensitas dijaga"}
  ]},
  races:[],
  strength:[
    {id:uid(),day:1,title:"Kaki dan core",ex:[
      {id:uid(),name:"Goblet squat",sets:3,reps:"8",load:"sedang"},
      {id:uid(),name:"Romanian deadlift",sets:3,reps:"8",load:"sedang"},
      {id:uid(),name:"Split squat",sets:3,reps:"8 / kaki",load:"badan"},
      {id:uid(),name:"Plank",sets:3,reps:"40 dtk",load:"badan"}]},
    {id:uid(),day:3,title:"Stabilitas dan glute",ex:[
      {id:uid(),name:"Glute bridge",sets:3,reps:"12",load:"badan"},
      {id:uid(),name:"Calf raise",sets:3,reps:"12",load:"badan"},
      {id:uid(),name:"Side plank",sets:3,reps:"30 dtk / sisi",load:"badan"},
      {id:uid(),name:"Single-leg balance",sets:2,reps:"45 dtk / kaki",load:"badan"}]}
  ]
});
let M=DEF_MAIN(), L={items:[]};

/* ---------- Penyimpanan: db bila ada, kalau tidak browser ---------- */
const S={db:null,timers:{},busy:{},dirty:{},loaded:{}};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem("rd_"+k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem("rd_"+k,JSON.stringify(v))}catch(e){}};
const setSync=t=>{const el=$("#sync");if(el)el.textContent=t};
const mergeMain=d=>{const b=DEF_MAIN();return Object.assign(b,d,{profile:Object.assign(b.profile,d.profile||{})})};
function save(key){
  if(S.db&&!S.loaded[key]){setSync("Data tersimpan belum selesai dimuat, ulangi sebentar lagi");return}
  if(S.db){clearTimeout(S.timers[key]);S.timers[key]=setTimeout(()=>flush(key),600);setSync("Menyimpan…")}
  else{lsSet(key,key==="main"?M:L);setSync("Tersimpan di browser ini")}
}
async function flush(key){
  if(S.busy[key]){S.dirty[key]=true;return}
  S.busy[key]=true;
  try{await S.db.doc("run/"+key).set(clone(key==="main"?M:L));setSync("Tersimpan")}
  catch(e){setSync("Gagal menyimpan ("+((e&&e.code)||"error")+")")}
  S.busy[key]=false;
  if(S.dirty[key]){S.dirty[key]=false;flush(key)}
}
function listen(key){
  const t=setTimeout(()=>setSync("Data belum terjangkau, mungkin belum terbaru"),10000);
  S.db.doc("run/"+key).onSnapshot(s=>{
    if(s.metadata.hasPendingWrites)return;
    if(!s.metadata.fromCache){clearTimeout(t);S.loaded[key]=true;setSync("Tersimpan")}
    if(!s.exists)return;
    const d=clone(s.data());
    if(JSON.stringify(d)===JSON.stringify(key==="main"?M:L))return;
    if(key==="main")M=mergeMain(d);else L=Object.assign({items:[]},d);
    const ae=document.activeElement;
    if(ae&&$("#view").contains(ae)&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))updateDerived();else render();
  },e=>{clearTimeout(t);setSync("Data tidak bisa dibaca ("+((e&&e.code)||"error")+")")});
}

/* ---------- Zona heart rate ---------- */
const PCT=[.5,.6,.7,.8,.9,1];
function hrMax(){
  const v=Number(M.profile.hrmax);
  if(v>100&&v<230)return{v:Math.round(v),est:false};
  return{v:Math.round(208-0.7*(Number(M.profile.age)||30)),est:true};
}
function zones(){
  const max=hrMax().v,rest=Number(M.profile.hrrest)||0;
  const hrr=M.profile.method==="hrr"&&rest>20&&rest<max-20;
  const e=PCT.map(p=>Math.round(hrr?rest+p*(max-rest):p*max));
  return[0,1,2,3,4].map(i=>({n:i+1,lo:i===0?e[0]:e[i]+1,hi:e[i+1]}));
}
const ZMETA=[
  {name:"Pemulihan",rpe:"1-2",talk:"Bisa mengobrol penuh",use:"Pemanasan, pendinginan, dan recovery run. Tujuannya melancarkan darah tanpa menambah beban."},
  {name:"Aerobik / Easy",rpe:"3-4",talk:"Bisa bicara kalimat utuh",use:"Fondasi latihan. Easy run dan long run membangun kapasitas aerobik, kapiler, dan efisiensi."},
  {name:"Tempo / Moderate",rpe:"5-6",talk:"Kalimat pendek",use:"Tempo run dan pace maraton. Nyaman tapi mulai terasa kerja."},
  {name:"Threshold",rpe:"7-8",talk:"Beberapa kata saja",use:"Threshold dan cruise interval. Menaikkan pace yang bisa dipertahankan sebelum laktat menumpuk."},
  {name:"VO2max / Anaerobik",rpe:"9-10",talk:"Tidak bisa bicara",use:"Interval pendek, strides, dan tes. Kerja berat, durasi singkat, pemulihan cukup."}
];
function zoneOfHr(h){
  h=Number(h);if(!h)return null;const z=zones();
  if(h<z[0].lo)return 0;
  for(let i=0;i<5;i++)if(h<=z[i].hi)return i+1;
  return 5;
}
const zlabel=n=>n==null?"-":n===0?"di bawah Z1":"Z"+n;

/* ---------- Turunan jadwal ---------- */
const planKm=()=>M.plan.reduce((a,d)=>a+(Number(d.km)||0),0);
const fmtKm=n=>(Math.round(n*10)/10).toString().replace(".",",");
function paceOf(km,min){km=Number(km);min=Number(min);if(!km||!min)return null;const p=min/km,m=Math.floor(p),s=Math.round((p-m)*60);return s===60?(m+1)+":00":m+":"+pad(s)}
function weekLogs(){const m=mondayOf(today()),e=addDays(m,6);return L.items.filter(l=>l.date>=m&&l.date<=e)}
function blockInfo(){
  const b=M.blocks,start=b.start||today();let acc=0;
  const w=Math.floor(daysBetween(start,today())/7);
  const total=b.items.reduce((a,x)=>a+(Number(x.weeks)||0),0);
  let cur=-1,wk=0;
  if(w>=0)for(let i=0;i<b.items.length;i++){const n=Number(b.items[i].weeks)||0;if(w<acc+n){cur=i;wk=w-acc+1;break}acc+=n}
  return{cur,wk,total,start,end:addDays(start,total*7-1),before:w<0,after:w>=total&&total>0};
}
const nextRace=()=>M.races.filter(r=>r.date>=today()).sort((a,b)=>a.date<b.date?-1:1)[0];

/* ---------- Router ---------- */
const V={};
function render(){
  const k=location.hash.slice(1);const key=V[k]?k:"ringkasan";
  $("#nav").innerHTML=["ringkasan","profil","program","block","race","strength","coach","zona"].filter(id=>V[id]).map(id=>'<a href="#'+id+'"'+(id===key?' aria-current="page"':"")+">"+V[id].t+"</a>").join("");
  $("#view").innerHTML=V[key].f();
  $("#who").textContent=M.profile.name?M.profile.name:"Program lari pribadi";
  updateDerived();
}

/* ---------- Helper tampilan ---------- */
const inp=(path,val,o={})=>'<input data-bind="'+path+'" '+(o.num?'data-num="1" type="number" inputmode="decimal" step="'+(o.step||1)+'"':'type="'+(o.type||"text")+'"')+' value="'+esc(val)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':"")+' aria-label="'+esc(o.label||"")+'">';
const sel=(path,val,opts,label)=>'<select data-bind="'+path+'" aria-label="'+esc(label||"")+'">'+opts.map(o=>'<option'+(o===val?" selected":"")+">"+esc(o)+"</option>").join("")+"</select>";
const head=(t,p,extra)=>'<div class="head"><div><h2>'+t+"</h2><p>"+p+"</p></div>"+(extra||"")+"</div>";
function zoneRows(){
  return zones().map((x,i)=>'<div class="zrow"><div class="zbadge" style="background:var(--z'+(i+1)+');color:#0F1720">Z'+(i+1)+'</div><div><b>'+ZMETA[i].name+'</b><div class="note">'+ZMETA[i].talk+" · RPE "+ZMETA[i].rpe+'</div></div><div class="zhr">'+x.lo+"–"+x.hi+' <span class="note">bpm</span></div></div>').join("");
}
function zoneBar(){
  const z=zones(),tot=z[4].hi-z[0].lo||1;
  return '<div class="zbar" role="img" aria-label="Lebar zona heart rate">'+z.map((x,i)=>'<i style="flex:'+(x.hi-x.lo+1)+';background:var(--z'+(i+1)+')"></i>').join("")+"</div>";
}
function hrRange(s){
  const m=/Z(\d)(?:-Z(\d))?/.exec(s||"");if(!m)return"";
  const z=zones(),a=z[Number(m[1])-1],b=z[Number(m[2]||m[1])-1];
  return a&&b?a.lo+"–"+b.hi+" bpm":"";
}

/* ---------- Ringkasan ---------- */
V.ringkasan={t:"Ringkasan",f:function(){
  const nr=nextRace(),bi=blockInfo(),done=weekLogs().reduce((a,l)=>a+(Number(l.km)||0),0),plan=planKm();
  const items=M.blocks.items,cur=bi.cur>=0?items[bi.cur]:null;
  let blk="Belum ada block",blkSub="Atur di menu Training Block";
  if(items.length){
    if(cur){blk=esc(cur.name);blkSub="Minggu "+bi.wk+" dari "+cur.weeks+" · target "+cur.vol+" km/minggu"}
    else if(bi.before){blk="Belum mulai";blkSub="Mulai "+fmtDate(bi.start)}
    else{blk="Selesai";blkSub="Block berakhir "+fmtDate(bi.end)}
  }
  const wl=weekLogs(),td=dayIdx(today());

  const last=L.items.slice().sort((a,b)=>a.date<b.date?1:-1).find(l=>l.feedback);

  "</div>"+
  '<div class="grid2"><div class="card"><h3>Minggu ini</h3><div class="week">'+cols+'</div><div class="legend"><span><b style="background:var(--surface2);border:1px solid var(--line)"></b>Program</span><span><b style="background:var(--accent)"></b>Selesai</span></div></div>'+

}};

let sampleFn=null,chat=[],busyFb={};
const sortedLogs=()=>L.items.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
function logLine(l){
  const pc=paceOf(l.km,l.min),z=zoneOfHr(l.hr);
  return l.date+" "+l.type+" "+l.km+" km"+(l.min?", "+l.min+" menit":"")+(pc?", pace "+pc+"/km":"")+(l.hr?", HR rata-rata "+l.hr+" ("+zlabel(z)+")":"")+(l.rpe?", RPE "+l.rpe:"")+(l.notes?", catatan: "+l.notes:"");
}
function coachContext(){
  const p=M.profile,bi=blockInfo(),cur=bi.cur>=0?M.blocks.items[bi.cur]:null,nr=nextRace();
  return"Profil: "+(p.name||"pelari")+", umur "+p.age+", berat "+p.weight+" kg, HR istirahat "+p.hrrest+", HR max "+hrMax().v+" bpm.\n"+
  "Zona HR (bpm): "+zones().map((x,i)=>"Z"+(i+1)+" "+x.lo+"-"+x.hi).join(", ")+".\n"+
  "Block: "+(cur?cur.name+" minggu "+bi.wk+" dari "+cur.weeks+", target "+cur.vol+" km/minggu, fokus "+cur.focus:"belum ada block aktif")+".\n"+
  "Race berikutnya: "+(nr?nr.name+" "+nr.dist+" tanggal "+nr.date+", target "+(nr.goal||"belum ada"):"belum ada")+".\n"+
  "Program mingguan: "+M.plan.map((d,i)=>DAYS[i]+" "+d.type+" "+d.km+" km "+d.zone).join("; ")+".\n"+
  "Strength: "+(M.strength.map(s=>DAYS[Number(s.day)]+" "+s.title).join("; ")||"belum ada")+".\n"+
  "Latihan terbaru:\n"+(sortedLogs().slice(0,6).map(logLine).join("\n")||"belum ada");
}
const RULES="Kamu coach lari yang praktis, suportif, dan jujur. Jawab dalam Bahasa Indonesia, teks biasa tanpa markdown dan tanpa tabel. Jangan mendiagnosis medis; bila ada nyeri, pusing, atau nyeri dada, sarankan berhenti latihan dan memeriksakan diri ke tenaga medis.";
const errCopy=c=>({not_granted:"Izin memakai Claude belum diberikan.",rate_limited:"Terlalu sering. Coba lagi beberapa saat lagi.",session_expired:"Sesi berakhir, masuk lagi lalu ulangi.",refused:"Coach tidak bisa menjawab input ini.",cancelled:""}[c]||"Coach belum bisa menjawab. Coba lagi.");
async function askFeedback(id){
  const l=L.items.find(x=>x.id===id);if(!l||!sampleFn||busyFb[id])return;
  busyFb[id]=true;const el=document.getElementById("fb-"+id),btn=document.querySelector('[data-action="fb"][data-id="'+id+'"]');
  if(btn)btn.disabled=true;if(el)el.innerHTML='<div class="fb">Coach sedang menilai…</div>';
  const plan=M.plan[dayIdx(l.date)];
  const prompt=RULES+' Maksimal 170 kata, dengan tiga bagian berlabel persis: "Penilaian:", "Zona dan intensitas:", "Saran sesi berikutnya:". Bandingkan hasil dengan program hari itu dan konteks block.\n\nKONTEKS\n'+coachContext()+"\n\nLATIHAN YANG DINILAI\n"+logLine(l)+"\nProgram hari itu: "+plan.type+" "+plan.km+" km zona "+plan.zone+(plan.note?" ("+plan.note+")":"");
  try{
    const r=await sampleFn(prompt,{cache:false,onText:u=>{const e=document.getElementById("fb-"+id);if(e)e.innerHTML='<div class="fb">'+esc(u.text)+"</div>"}});
    l.feedback=r.text;save("logs");
  }catch(e){
    const e2=document.getElementById("fb-"+id);if(e2)e2.innerHTML=l.feedback?'<div class="fb">'+esc(l.feedback)+"</div>":(e&&e.text?'<div class="fb">'+esc(e.text)+"</div>":"")+'<p class="note">'+esc(errCopy(e&&e.code))+"</p>";
  }
  busyFb[id]=false;if(btn)btn.disabled=false;
}
async function askChat(){
  const box=$("#chatIn"),out=$("#chatOut"),q=box&&box.value.trim();if(!q||!sampleFn)return;
  box.value="";chat.push({role:"user",content:q});
  out.innerHTML+='<div class="fb"><b>Anda:</b> '+esc(q)+'</div><div class="fb" id="chatLive">Coach sedang menjawab…</div>';
  const turns=[{role:"user",content:RULES+" Jawab ringkas, maksimal 150 kata.\n\nKONTEKS\n"+coachContext()},...chat.slice(-8)];
  try{
    const r=await sampleFn(turns,{cache:false,onText:u=>{const e=document.getElementById("chatLive");if(e)e.textContent=u.text}});
    chat.push({role:"assistant",content:r.text});
  }catch(e){const e2=document.getElementById("chatLive");if(e2)e2.textContent=errCopy(e&&e.code);chat.pop()}
  const e3=document.getElementById("chatLive");if(e3)e3.removeAttribute("id");
}
V.coach={t:"Coach AI",f:function(){
  const logs=sortedLogs().map(l=>{const pc=paceOf(l.km,l.min),z=zoneOfHr(l.hr);
    return'<div class="log"><div class="row" style="align-items:center"><div><b>'+fmtDate(l.date)+" · "+esc(l.type)+'</b></div><div style="flex:0 0 auto;display:flex;gap:6px">'+(sampleFn?'<button class="btn sm" data-action="fb" data-id="'+l.id+'">'+(l.feedback?"Ulangi feedback":"Minta feedback")+"</button>":"")+'<button class="btn del" data-action="logdel" data-id="'+l.id+'" aria-label="Hapus latihan">Hapus</button></div></div>'+
    '<div class="meta"><span><b>'+fmtKm(Number(l.km)||0)+"</b> km</span>"+(l.min?"<span><b>"+l.min+"</b> menit</span>":"")+(pc?"<span>pace <b>"+pc+"</b>/km</span>":"")+(l.hr?"<span>HR <b>"+l.hr+"</b> ("+zlabel(z)+")</span>":"")+(l.rpe?"<span>RPE <b>"+l.rpe+"</b></span>":"")+"</div>"+
    (l.notes?'<p class="note">'+esc(l.notes)+"</p>":"")+'<div id="fb-'+l.id+'">'+(l.feedback?'<div class="fb">'+esc(l.feedback)+"</div>":"")+"</div></div>"}).join("");
  return head("Coach AI","Catat setiap latihan, lalu minta coach menilai hasilnya terhadap program, zona HR, dan fase block Anda.")+
  (sampleFn?"":'<div class="card"><p class="note">Coach AI hanya aktif saat halaman dibuka lewat Claude. Pencatatan latihan tetap berjalan.</p></div>')+
  '<div class="card"><h3>Catat latihan</h3><div class="row"><label>Tanggal<input id="lDate" type="date" value="'+today()+'"></label><label>Jenis<select id="lType">'+TYPES.filter(t=>t!=="Istirahat").map(t=>"<option>"+t+"</option>").join("")+'</select></label><label>Jarak (km)<input id="lKm" type="number" step="0.01" inputmode="decimal"></label><label>Durasi (menit)<input id="lMin" type="number" step="0.1" inputmode="decimal"></label></div>'+
  '<div class="row"><label>HR rata-rata<input id="lHr" type="number" inputmode="numeric"></label><label>RPE (1-10)<input id="lRpe" type="number" min="1" max="10" inputmode="numeric"></label></div><label>Catatan (rasa kaki, cuaca, nyeri, dll.)<textarea id="lNotes"></textarea></label><div><button class="btn" data-action="logadd">Simpan latihan</button></div></div>'+
  '<div class="card"><h3>Riwayat latihan</h3>'+(logs||'<div class="empty">Belum ada latihan tercatat.</div>')+"</div>"+
  (sampleFn?'<div class="card"><h3>Tanya coach</h3><div id="chatOut" style="display:flex;flex-direction:column;gap:8px"></div><label>Pertanyaan<textarea id="chatIn" placeholder="Contoh: Apakah saya perlu mengurangi volume minggu depan?"></textarea></label><div><button class="btn" data-action="chat">Kirim</button></div></div>':"");
}};

/* ---------- Event ---------- */
function setPath(o,path,v){const k=path.split(".");let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
document.addEventListener("change",e=>{
  const t=e.target;if(!t.dataset||!t.dataset.bind)return;
  let v=t.value;if(t.dataset.num)v=v===""?"":Number(v);
  setPath(M,t.dataset.bind,v);save("main");updateDerived();
  if(t.dataset.bind==="profile.name")$("#who").textContent=v||"Program lari pribadi";
});
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action,i=Number(b.dataset.i),j=Number(b.dataset.j),id=b.dataset.id;
  if(a==="scale"){const f=1+(Number(val("scalePct"))||0)/100;M.plan.forEach(d=>{d.km=Math.round((Number(d.km)||0)*f*2)/2});save("main");render()}
  else if(a==="blockadd"){M.blocks.items.push({id:uid(),name:"Block baru",weeks:4,vol:30,focus:""});save("main");render()}
  else if(a==="blockdel"){M.blocks.items.splice(i,1);save("main");render()}
  else if(a==="raceadd"){const n=val("rName"),d=val("rDate");if(!n||!d){setSync("Isi nama dan tanggal race");return}M.races.push({id:uid(),name:n,date:d,dist:val("rDist")||"-",goal:val("rGoal"),prio:val("rPrio")||"B"});save("main");render()}
  else if(a==="racedel"){M.races=M.races.filter(r=>r.id!==id);save("main");render()}
  else if(a==="sesadd"){M.strength.push({id:uid(),day:0,title:"Sesi baru",ex:[]});save("main");render()}
  else if(a==="sesdel"){M.strength.splice(i,1);save("main");render()}
  else if(a==="exadd"){M.strength[i].ex.push({id:uid(),name:"Gerakan baru",sets:3,reps:"10",load:"badan"});save("main");render()}
  else if(a==="exdel"){M.strength[i].ex.splice(j,1);save("main");render()}
  else if(a==="logadd"){const km=Number(val("lKm")),d=val("lDate");if(!km||!d){setSync("Isi tanggal dan jarak");return}
    L.items.push({id:uid(),date:d,type:val("lType"),km:km,min:Number(val("lMin"))||"",hr:Number(val("lHr"))||"",rpe:Number(val("lRpe"))||"",notes:val("lNotes"),feedback:""});save("logs");render()}
  else if(a==="logdel"){L.items=L.items.filter(l=>l.id!==id);save("logs");render()}
  else if(a==="fb")askFeedback(id);
  else if(a==="chat")askChat();
});
window.addEventListener("hashchange",render);

/* ---------- Mulai ---------- */
render();
(async function init(){
  let db=null;
  try{if(window.claude&&window.claude.use){db=await window.claude.use("db");sampleFn=await window.claude.use("sample")}}catch(e){}
  if(sampleFn)render();
  if(db){S.db=db;listen("main");listen("logs")}
  else{const m=lsGet("main"),l=lsGet("logs");if(m)M=mergeMain(m);if(l)L=Object.assign({items:[]},l);setSync("Tersimpan di browser ini");render()}
})();
})();
</script>
</body>
</html>
